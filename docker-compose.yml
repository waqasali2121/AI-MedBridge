version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: medbridge-db
    environment:
      POSTGRES_USER: medbridge
      POSTGRES_PASSWORD: medbridge
      POSTGRES_DB: medbridge
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medbridge"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: medbridge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medbridge-backend
    environment:
      DATABASE_URL: postgresql://medbridge:medbridge@db:5432/medbridge
      SECRET_KEY: dev-secret-key-change-in-production
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: qwen2:7b
      UPLOAD_DIR: /app/uploads
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  ollama_data:
  upload_data:
